# Mantém o servidor do Render acordado (RNF002 - desempenho e RNF003 - disponibilidade).
# No plano gratuito, o Render "dorme" depois de 15 minutos sem visitas e a primeira
# visita depois disso demora quase um minuto. Este robô do GitHub chama a rota /saude
# a cada 10 minutos, então o servidor fica sempre pronto.
# A rota /saude não usa o banco de dados, para não gastar as horas gratuitas do Neon.

name: Manter servidor acordado

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # permite rodar na mão pela aba Actions

jobs:
  cutucar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar a rota /saude
        run: curl --silent --show-error --fail --max-time 120 --retry 2 https://helpymath-api.onrender.com/saude
